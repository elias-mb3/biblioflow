<section class="auth-layout">
  <div class="auth-card auth-card--wide">
    <div class="brand">
      <h1>Cadastro de Gestor</h1>
      <p>Crie seu acesso administrativo para gerenciar o acervo</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-group">
        <label for="fullName">Nome completo <span class="required">*</span></label>
        <input
          id="fullName"
          type="text"
          formControlName="fullName"
          class="form-control"
          [class.is-invalid]="fieldInvalid('fullName')"
          placeholder="Como aparecerá no perfil"
          autocomplete="name"
        />
        <small class="form-error" *ngIf="fieldInvalid('fullName')">
          Informe seu nome completo (mín. 3 caracteres).
        </small>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email">E-mail <span class="required">*</span></label>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="form-control"
            [class.is-invalid]="fieldInvalid('email')"
            placeholder="gestor@biblioflow.com"
            autocomplete="email"
          />
          <small class="form-error" *ngIf="fieldInvalid('email')">
            Informe um e-mail válido.
          </small>
        </div>

        <div class="form-group">
          <label for="phone">Telefone <span class="required">*</span></label>
          <input
            id="phone"
            type="tel"
            formControlName="phone"
            class="form-control"
            [class.is-invalid]="fieldInvalid('phone')"
            placeholder="(11) 99999-9999"
            autocomplete="tel"
          />
          <small class="form-error" *ngIf="fieldInvalid('phone')">
            Informe um telefone válido.
          </small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha <span class="required">*</span></label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="form-control"
          [class.is-invalid]="fieldInvalid('password')"
          placeholder="Mínimo 6 caracteres"
          autocomplete="new-password"
        />
        <small class="form-error" *ngIf="fieldInvalid('password')">
          A senha deve ter pelo menos 6 caracteres.
        </small>
      </div>

      <div class="banner banner--danger mb-4" *ngIf="errorMessage()">
        <div>{{ errorMessage() }}</div>
        <ul *ngIf="fieldErrors().length > 0" class="mt-2">
          <li *ngFor="let detail of fieldErrors()">{{ detail }}</li>
        </ul>
      </div>

      <div class="form-actions form-actions--between">
        <a routerLink="/login" class="btn btn--ghost">Voltar ao login</a>
        <button type="submit" class="btn btn--primary btn--lg" [disabled]="loading()">
          {{ loading() ? 'Cadastrando…' : 'Criar conta de gestor' }}
        </button>
      </div>
    </form>
  </div>
</section>
